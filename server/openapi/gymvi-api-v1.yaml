openapi: 3.1.0
info:
  title: Gymvi API
  version: 0.3.9-dev
  description: Traceable facility discovery, usage-option evidence, bounded related-image lookup, address lookup, and road-route preview contract for Gymvi Android.
servers:
  - url: http://127.0.0.1:8080
    description: Isolated local development server
paths:
  /actuator/health:
    get:
      operationId: getHealth
      summary: Read the server process health without exposing dependency details.
      responses:
        '200':
          description: Server process is healthy.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: UP
  /api/v1/meta/version:
    get:
      operationId: getVersion
      summary: Read API, schema, and active dataset versions with their checked sources, and the AI model the server is set up to call.
      responses:
        '200':
          description: Version and dependency summary.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionEnvelope'
  /api/v1/facilities:
    get:
      operationId: searchFacilities
      summary: Search the active Facility dataset inside a WGS84 bounding box.
      parameters:
        - $ref: '#/components/parameters/MinLongitude'
        - $ref: '#/components/parameters/MinLatitude'
        - $ref: '#/components/parameters/MaxLongitude'
        - $ref: '#/components/parameters/MaxLatitude'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: query
          in: query
          required: false
          description: Normalized facility-name, registered-industry, or description query.
          schema:
            type: string
            maxLength: 80
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [relevance, distance]
            default: relevance
        - name: cursor
          in: query
          required: false
          description: Opaque cursor returned as next_cursor by the preceding page.
          schema:
            type: string
            maxLength: 32
      responses:
        '200':
          description: Deterministically ranked Facility set for the requested map bounds.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityListEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/DatasetUnavailable'
  /api/v1/facilities/{facility_id}:
    get:
      operationId: getFacility
      summary: Read one Facility and its source-record link from the active dataset.
      parameters:
        - name: facility_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 160
      responses:
        '200':
          description: Facility detail and provenance source.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityDetailEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          description: Facility is absent from the active dataset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/DatasetUnavailable'
  /api/v1/facilities/{facility_id}/usage-options:
    get:
      operationId: getFacilityUsageOptions
      summary: Read verified program options joined to one Facility.
      description: Only exact or manually reviewed program joins are returned. Missing program data is reported explicitly and never converted into inferred availability. Safety evidence is not part of this default flow and is reserved for an explicit AI safety question.
      parameters:
        - name: facility_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 160
      responses:
        '200':
          description: Usage options and explicit program-source availability state.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageOptionListEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          description: Facility is absent from the active dataset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/DatasetUnavailable'
  /api/v1/evidence/{evidence_id}:
    get:
      operationId: getEvidence
      summary: Read field-level provenance for one active program usage option.
      parameters:
        - name: evidence_id
          in: path
          required: true
          description: Program evidence identifier in the form program:<usage_option_id>.
          schema:
            type: string
            minLength: 1
            maxLength: 200
            pattern: '^[A-Za-z0-9:_\-.]+$'
      responses:
        '200':
          description: Program facts, source fields, transformations, dataset versions, and license attribution.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          description: The usage option is absent from an active Program version or its Facility version is inactive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/DatasetUnavailable'
  /api/v1/facilities/{facility_id}/media:
    get:
      operationId: getFacilityMedia
      summary: Read up to four unverified NAVER image-search candidates for one selected Facility.
      description: The candidates are related search results, not verified official facility photos. Clients must preserve that distinction.
      parameters:
        - name: facility_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 160
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 4
            default: 4
      responses:
        '200':
          description: Bounded image candidates and the user-initiated NAVER image-search URL.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityMediaEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          description: Facility is absent from the active dataset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: This client exceeded the selected-facility media request allowance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: NAVER image search failed or returned an invalid response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Image search is not configured, the dataset is unavailable, or the daily provider-call budget is exhausted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/addresses/search:
    get:
      operationId: searchAddresses
      summary: Convert a bounded road-name or lot-number address query to coordinates through the server-side provider adapter.
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 120
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 5
      responses:
        '200':
          description: Matching road-name and lot-number addresses inside Korea.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeocodingSearchEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: This client exceeded the address-search request allowance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: The geocoding provider failed to return a valid response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Geocoding is not configured or the daily provider-call budget is exhausted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/discovery-feed:
    get:
      operationId: getDiscoveryFeed
      summary: Build a deterministic exercise discovery feed for the current map area.
      description: Nearby public facilities, local context, eligible recommendation items, and official exercise content are assembled by server logic. Program availability is never inferred when its evidence dataset is inactive.
      parameters:
        - $ref: '#/components/parameters/MinLongitude'
        - $ref: '#/components/parameters/MinLatitude'
        - $ref: '#/components/parameters/MaxLongitude'
        - $ref: '#/components/parameters/MaxLatitude'
        - name: local_hour
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 23
        - name: favorite_facility_id
          in: query
          required: false
          description: Repeated local-only preference signal. At most 50 values are accepted.
          schema:
            type: array
            maxItems: 50
            items:
              type: string
              maxLength: 160
        - name: preferred_category
          in: query
          required: false
          description: Allowlisted sport preferences from opted-in local memory, never transcript text.
          schema:
            type: array
            maxItems: 13
            uniqueItems: true
            items:
              type: string
              enum: [SWIMMING, FITNESS, YOGA_PILATES, DANCE, TENNIS, BADMINTON, TABLE_TENNIS, GOLF, SQUASH, SKATING, TEAM_BALL, MARTIAL_ARTS, CLIMBING]
        - name: recent_facility_id
          in: query
          required: false
          description: Repeated recent-view signal. At most 50 values are accepted.
          schema:
            type: array
            maxItems: 50
            items:
              type: string
              maxLength: 160
      responses:
        '200':
          description: Deterministic discovery feed for the requested map bounds.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryFeedEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/DatasetUnavailable'
  /api/v1/exercise-contents:
    get:
      operationId: getExerciseContents
      summary: List curated exercise content by sport.
      parameters:
        - name: sport
          in: query
          required: false
          schema:
            type: string
            enum: [SWIMMING, RUNNING, STRETCHING, FITNESS, YOGA_PILATES, DANCE, TENNIS, BADMINTON, TABLE_TENNIS, GOLF, SQUASH, SKATING, TEAM_BALL, MARTIAL_ARTS, CLIMBING]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
      responses:
        '200':
          description: Curated content, possibly empty, with a version for the exact resource bytes.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseContentsEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
  /api/v1/routes/preview:
    post:
      operationId: previewRoadRoute
      summary: Preview one bounded road route inside Korea through the server-side provider adapter.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutePreviewRequest'
      responses:
        '200':
          description: Provider-backed road path, distance, and duration.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutePreviewEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: This client exceeded the route-specific request allowance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: The route provider failed to return a valid route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: The route provider is not configured or the daily provider-call budget is exhausted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/recommendations:
    post:
      operationId: recommendUsageOptions
      summary: Rank eligible usage options deterministically inside a bounded area.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationRequest'
      responses:
        '200':
          description: Ranked usage options, traceable facts, and exclusion counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/DatasetUnavailable'
  /api/v1/ai/turns:
    post:
      operationId: createAiTurn
      summary: Continue a bounded Gymvi exercise-decision conversation.
      description: The server keeps short transient conversation state, gives the model only derived context and public candidate facts, and never sends exact origin coordinates. Cards and client actions are validated against deterministic server results. Provider failure, rate limiting, or budget blocking returns an explicit fallback in the same response contract.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiTurnRequest'
      responses:
        '200':
          description: One validated AI turn or an explicit deterministic fallback.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiTurnEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: This client exceeded the shared API request allowance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/ai/turns/stream:
    post:
      operationId: streamAiTurn
      summary: Stream a bounded Gymvi exercise-decision conversation.
      description: |
        Uses the same request, privacy checks, budget and deterministic tool validation as createAiTurn.
        Text is received from the upstream provider during generation. Only decoded, content-checked
        summary sentences are emitted as reply_delta events with JSON data {"delta":"text"}.
        Tool arguments, reasoning and unvalidated cards or actions are never streamed.
        The complete event contains the full AiTurnEnvelope and is authoritative: replace any partial
        reply and apply cards and client actions only then. On an error event, data is ErrorEnvelope;
        discard the provisional reply. No complete event means the turn did not finish.
        Provider outages can complete with the existing fallback metadata. Deterministic replies are
        sent once without artificial pacing. Parse/rate-limit errors before the stream use normal JSON.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiTurnRequest'
      responses:
        '200':
          description: SSE reply_delta events followed by exactly one complete or error event.
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: reply_delta
                data: {"delta":"가볍게 걸으며 시작해 보세요."}

                event: complete
                data: {"data":{"conversation_id":"example","reply":"가볍게 걸으며 시작해 보세요.","action":"EXERCISE_GUIDE","cards":[],"exercise_contents":[],"client_actions":[],"uncertainties":[],"fallback":false,"fallback_reason_code":null},"meta":{"request_id":"example","dataset_version":null,"as_of":null},"warnings":[]}
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: This client exceeded the shared API request allowance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/usage-options/compare:
    post:
      operationId: compareUsageOptions
      summary: Compare two to five active usage options under the same conditions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComparisonRequest'
      responses:
        '200':
          description: Requested options in request order with side-by-side dimensions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          description: At least one ID does not belong to the active program dataset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/DatasetUnavailable'
components:
  headers:
    RequestId:
      description: Server-generated UUID that never reuses a caller-provided value.
      schema:
        type: string
        format: uuid
  parameters:
    MinLongitude:
      name: min_longitude
      in: query
      required: true
      schema:
        type: number
        minimum: -180
        maximum: 180
    MinLatitude:
      name: min_latitude
      in: query
      required: true
      schema:
        type: number
        minimum: -90
        maximum: 90
    MaxLongitude:
      name: max_longitude
      in: query
      required: true
      schema:
        type: number
        minimum: -180
        maximum: 180
    MaxLatitude:
      name: max_latitude
      in: query
      required: true
      schema:
        type: number
        minimum: -90
        maximum: 90
  responses:
    ValidationError:
      description: Bounding-box, limit, identifier, or parameter validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    DatasetUnavailable:
      description: No verified active Facility dataset is queryable; this is not an empty result.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ApiMeta:
      type: object
      required: [request_id, dataset_version, as_of]
      properties:
        request_id:
          type: string
          format: uuid
        dataset_version:
          type: [string, 'null']
        as_of:
          type: [string, 'null']
          format: date-time
    ApiWarning:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    VersionData:
      type: object
      required: [app_version, api_version, schema_version, dataset_status, dependencies]
      properties:
        app_version:
          type: string
        api_version:
          type: string
        schema_version:
          type: string
        dataset_status:
          type: string
          enum: [ACTIVE, NOT_CONNECTED]
        dependencies:
          type: object
          additionalProperties:
            type: string
        ai_model:
          $ref: '#/components/schemas/AiModelStatus'
        datasets:
          type: array
          description: ACTIVE published datasets from the same read that fills meta.dataset_version and meta.as_of, FACILITY first. Empty while dataset_status is NOT_CONNECTED. Servers before this field omit it; clients treat a missing field, an empty list, or a failed request as unknown and never keep values from an earlier response.
          items:
            $ref: '#/components/schemas/DatasetSource'
    VersionEnvelope:
      type: object
      required: [data, meta, warnings]
      properties:
        data:
          $ref: '#/components/schemas/VersionData'
        meta:
          $ref: '#/components/schemas/ApiMeta'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ApiWarning'
    DatasetSource:
      type: object
      description: One ACTIVE published dataset. provider and license come only from a server registry entry checked against this exact publish (same dataset kind, dataset version, source dataset ID, and source payload hash). A new publish, a value nobody checked, or a publish with no entry is null rather than guessed. license is null when none of its values are known.
      required: [dataset_kind, dataset_version, as_of, provider, license]
      properties:
        dataset_kind:
          type: string
          enum: [FACILITY, PROGRAM]
        dataset_version:
          type: string
        as_of:
          type: string
          format: date-time
        provider:
          type: [string, 'null']
        license:
          oneOf:
            - $ref: '#/components/schemas/DatasetLicense'
            - type: 'null'
    DatasetLicense:
      type: object
      description: name is checked license wording from the registry only and is never taken from publish records. url and attribution come from the registry, or from the values stored at publish when the registry entry matches and they pass the same checks (https with a host and no user info or key-like query names; plain display text). attribution is source-required text shown exactly as given.
      required: [name, url, attribution]
      properties:
        name:
          type: [string, 'null']
        url:
          type: [string, 'null']
          format: uri
        attribution:
          type: [string, 'null']
    AiModelStatus:
      type: object
      description: Server setup read from the AI provider the server actually built. CONFIGURED does not promise remaining budget, a model reply for any turn, or which model produced a reply, and no keys, endpoints, or local paths are included. Servers before this field omit ai_model; clients treat a missing field, NOT_CONFIGURED, or a failed request as an unknown model.
      required: [provider, configured_model, status]
      properties:
        provider:
          type: [string, 'null']
          enum: [OPENAI, null]
        configured_model:
          type: [string, 'null']
        status:
          type: string
          enum: [CONFIGURED, NOT_CONFIGURED]
    Coordinate:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
    FacilityType:
      type: object
      required: [code, name]
      properties:
        code:
          type: [string, 'null']
        name:
          type: [string, 'null']
    FacilityClass:
      type: object
      required: [code, name]
      properties:
        code:
          type: [string, 'null']
        name:
          type: [string, 'null']
    AdministrativeArea:
      type: object
      required: [sido, sigungu]
      properties:
        sido:
          type: [string, 'null']
        sigungu:
          type: [string, 'null']
    FactualState:
      type: object
      required: [state, reason_code, evidence_id]
      properties:
        state:
          type: string
          enum: [OPEN, CLOSED, UNKNOWN]
        reason_code:
          type: string
        evidence_id:
          type: [string, 'null']
    ProvenanceLink:
      type: object
      required: [href, source_record_id]
      properties:
        href:
          type: string
        source_record_id:
          type: string
    FacilitySummary:
      type: object
      required: [facility_id, name, facility_type, facility_class, road_address, lot_address, administrative_area, phone, description, gross_floor_area_square_meters, coordinate, facility_operation, provenance]
      properties:
        facility_id:
          type: string
        name:
          type: string
        facility_type:
          $ref: '#/components/schemas/FacilityType'
        facility_class:
          $ref: '#/components/schemas/FacilityClass'
        road_address:
          type: [string, 'null']
        lot_address:
          type: [string, 'null']
        administrative_area:
          $ref: '#/components/schemas/AdministrativeArea'
        phone:
          type: [string, 'null']
        description:
          type: [string, 'null']
        gross_floor_area_square_meters:
          type: [number, 'null']
          exclusiveMinimum: 0
          maximum: 10000000
        coordinate:
          $ref: '#/components/schemas/Coordinate'
        facility_operation:
          $ref: '#/components/schemas/FactualState'
        operating_hours:
          $ref: '#/components/schemas/OperatingHours'
        provenance:
          $ref: '#/components/schemas/ProvenanceLink'
    OperatingHours:
      type: [object, 'null']
      description: Hours published on an operator page with the time Gymvi checked them. They never change facility_operation and do not mean the facility is open now.
      required: [schedule, closed_days, note, sources, checked_at]
      properties:
        schedule:
          type: array
          minItems: 1
          items:
            type: object
            required: [days, hours]
            properties:
              days:
                type: string
              hours:
                type: string
        closed_days:
          type: array
          items:
            type: string
        note:
          type: [string, 'null']
        sources:
          type: array
          minItems: 1
          items:
            type: object
            required: [name, url]
            properties:
              name:
                type: string
              url:
                type: string
                format: uri
        checked_at:
          type: string
          format: date-time
    FacilityListData:
      type: object
      required: [facilities, total_count, next_cursor]
      properties:
        facilities:
          type: array
          items:
            $ref: '#/components/schemas/FacilitySummary'
        total_count:
          type: integer
          minimum: 0
        next_cursor:
          type: [string, 'null']
    FacilityListEnvelope:
      type: object
      required: [data, meta, warnings]
      properties:
        data:
          $ref: '#/components/schemas/FacilityListData'
        meta:
          $ref: '#/components/schemas/ApiMeta'
        warnings:
