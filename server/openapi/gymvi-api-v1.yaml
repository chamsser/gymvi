      additionalProperties: false
      required: [values, strength]
      properties:
        values:
          type: array
          minItems: 1
          items:
            type: string
            enum: [SWIMMING, FITNESS, YOGA_PILATES, DANCE, TENNIS, BADMINTON, TABLE_TENNIS, GOLF, SQUASH, SKATING, TEAM_BALL, MARTIAL_ARTS, CLIMBING]
        strength: {$ref: '#/components/schemas/ConditionStrength'}
    WeekdayCondition:
      type: object
      additionalProperties: false
      required: [values, strength]
      properties:
        values:
          type: array
          minItems: 1
          items: {type: string, enum: [MON, TUE, WED, THU, FRI, SAT, SUN]}
        strength: {$ref: '#/components/schemas/ConditionStrength'}
    TargetGroupCondition:
      type: object
      additionalProperties: false
      required: [values, strength]
      properties:
        values:
          type: array
          minItems: 1
          items: {type: string, enum: [CHILD, YOUTH, ADULT, SENIOR]}
        strength: {$ref: '#/components/schemas/ConditionStrength'}
    TimeCondition:
      type: object
      additionalProperties: false
      required: [earliest, latest, strength]
      properties:
        earliest: {type: string, pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'}
        latest: {type: string, pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'}
        strength: {$ref: '#/components/schemas/ConditionStrength'}
    PriceCondition:
      type: object
      additionalProperties: false
      required: [value, strength]
      properties:
        value: {type: integer, minimum: 0, maximum: 10000000}
        strength: {$ref: '#/components/schemas/ConditionStrength'}
        unit:
          type: [string, 'null']
          enum: [MONTH, SESSION, null]
          description: Omitted or null compares the known price_won regardless of its billing unit, as before. MONTH or SESSION is met only by a program on the reviewed free list or by an option whose price_type_name parses to exactly one month or exactly one session; any other or unparsed billing unit is MAX_PRICE_WON_UNKNOWN. Amounts are never converted between units, and a continuation omits a null unit.
    DistanceCondition:
      type: object
      additionalProperties: false
      required: [value, strength]
      properties:
        value: {type: integer, minimum: 100, maximum: 100000}
        strength: {$ref: '#/components/schemas/ConditionStrength'}
    FlagCondition:
      type: object
      additionalProperties: false
      required: [strength]
      properties:
        strength: {$ref: '#/components/schemas/ConditionStrength'}
    RecommendationConditions:
      type: object
      additionalProperties: false
      properties:
        categories: {$ref: '#/components/schemas/CategoryCondition'}
        weekdays: {$ref: '#/components/schemas/WeekdayCondition'}
        start_time: {$ref: '#/components/schemas/TimeCondition'}
        max_price_won: {$ref: '#/components/schemas/PriceCondition'}
        max_distance_meters: {$ref: '#/components/schemas/DistanceCondition'}
        target_groups: {$ref: '#/components/schemas/TargetGroupCondition'}
        beginner: {$ref: '#/components/schemas/FlagCondition'}
        application_available: {$ref: '#/components/schemas/FlagCondition'}
    RecommendationPreferences:
      type: object
      additionalProperties: false
      properties:
        favorite_facility_ids: {type: array, maxItems: 20, items: {type: string, maxLength: 160}}
        recent_facility_ids: {type: array, maxItems: 20, items: {type: string, maxLength: 160}}
    RecommendationRequest:
      type: object
      additionalProperties: false
      required: [area]
      properties:
        area: {$ref: '#/components/schemas/RecommendationArea'}
        origin: {$ref: '#/components/schemas/RecommendationOrigin'}
        date: {type: string, format: date}
        conditions: {$ref: '#/components/schemas/RecommendationConditions'}
        preferences: {$ref: '#/components/schemas/RecommendationPreferences'}
        limit: {type: integer, minimum: 1, maximum: 50, default: 20}
        max_per_facility: {type: integer, minimum: 1, maximum: 10, default: 3}
    AiTurnContext:
      type: object
      additionalProperties: false
      required: [area]
      properties:
        area: {$ref: '#/components/schemas/RecommendationArea'}
        date: {type: string, format: date}
        preferences: {$ref: '#/components/schemas/RecommendationPreferences'}
    AiMemoryFacts:
      type: object
      additionalProperties: false
      required: [categories, weekdays, beginner]
      properties:
        categories:
          type: array
          uniqueItems: true
          maxItems: 13
          items: {type: string, enum: [SWIMMING, FITNESS, YOGA_PILATES, DANCE, TENNIS, BADMINTON, TABLE_TENNIS, GOLF, SQUASH, SKATING, TEAM_BALL, MARTIAL_ARTS, CLIMBING]}
        weekdays:
          type: array
          uniqueItems: true
          maxItems: 7
          items: {type: string, enum: [MON, TUE, WED, THU, FRI, SAT, SUN]}
        earliest_start: {type: [string, 'null'], pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'}
        latest_start: {type: [string, 'null'], pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'}
        max_price_won: {type: [integer, 'null'], minimum: 0, maximum: 10000000}
        max_distance_meters: {type: [integer, 'null'], minimum: 100, maximum: 100000}
        beginner: {type: boolean}
    AiReferences:
      type: object
      additionalProperties: false
      properties:
        memory: {$ref: '#/components/schemas/AiMemoryFacts'}
        age_band: {type: string, enum: [YOUTH, ADULT, SENIOR]}
        experience: {type: string, enum: [BEGINNER, REGULAR, EXPERIENCED]}
        goal: {type: string, enum: [GENERAL_FITNESS, STRENGTH, FLEXIBILITY, ENDURANCE, WEIGHT_MANAGEMENT]}
    AiTurnRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        conversation_id:
          type: [string, 'null']
          minLength: 16
          maxLength: 80
          pattern: '^[A-Za-z0-9_-]{16,80}$'
        message:
          type: string
          minLength: 1
          maxLength: 1000
        references: {$ref: '#/components/schemas/AiReferences'}
        continuation:
          type: string
          maxLength: 8000
          description: Strict structured conditions returned by the server, applied only to a new conversation. Never a transcript. Optional reference_matched and reference_values record shared reference values; revoked fields are removed before transport and before model use.
        origin:
          allOf:
            - $ref: '#/components/schemas/RecommendationOrigin'
          description: Ephemeral approximate origin for deterministic server calculations on this turn. It is never included in model input or retained conversation state.
        context:
          oneOf:
            - $ref: '#/components/schemas/AiTurnContext'
            - type: 'null'
          description: Required for a new conversation and omitted on follow-up turns so the original search area remains stable. Start a new conversation to change the area.
    AiAction:
      type: string
      enum: [ASK_CLARIFYING_QUESTION, SHOW_OPTIONS, COMPARE_OPTIONS, EXERCISE_GUIDE, SAFETY_GUIDANCE, FOCUS_MAP, SELECT_DESTINATION, PREVIEW_ROUTE, OUT_OF_SCOPE, MANUAL_FILTERS]
    AiClientAction:
      type: object
      additionalProperties: false
      required: [type, option_id, facility_id, option_ids]
      properties:
        type:
          type: string
          enum: [FOCUS_MAP, SELECT_USAGE_OPTION, PREVIEW_ROUTE, OPEN_USAGE_OPTION_COMPARISON, OPEN_MANUAL_FILTERS]
        option_id: {type: [string, 'null'], maxLength: 160}
        facility_id: {type: [string, 'null'], maxLength: 160}
        option_ids:
          type: array
          maxItems: 3
          uniqueItems: true
          items: {type: string, maxLength: 160}
    AiTurnData:
      type: object
      required: [conversation_id, reply, action, cards, exercise_contents, client_actions, uncertainties, fallback, fallback_reason_code]
      properties:
        conversation_id:
          type: string
          minLength: 16
          maxLength: 80
        reply:
          type: string
          maxLength: 500
        action: {$ref: '#/components/schemas/AiAction'}
        conversation_title: {type: [string, 'null'], maxLength: 80}
        continuation: {type: [string, 'null'], maxLength: 8000}
        memory_facts:
          description: Newly stated allowlisted facts from this turn, excluding previous conditions and copied reference values. Null for prechecks, provider fallback, and data lookup failure. This is a delta, not a full memory replacement. max_price_won is set only when a successful search on this turn executed a unitless limit equal to the one amount stated in this message; monthly or per-session limits and model-extracted budgets are never learned.
          oneOf:
            - $ref: '#/components/schemas/AiMemoryFacts'
            - type: 'null'
        cards:
          type: array
          maxItems: 5
          items: {$ref: '#/components/schemas/RecommendationItem'}
        exercise_contents:
          type: array
          maxItems: 2
          items: {$ref: '#/components/schemas/ExerciseContentItem'}
        client_actions:
          type: array
          maxItems: 2
          items: {$ref: '#/components/schemas/AiClientAction'}
        uncertainties:
          type: array
          maxItems: 20
          items: {type: string, maxLength: 160}
        fallback: {type: boolean}
        fallback_reason_code: {type: [string, 'null']}
    AiTurnEnvelope:
      type: object
      required: [data, meta, warnings]
      properties:
        data: {$ref: '#/components/schemas/AiTurnData'}
        meta: {$ref: '#/components/schemas/ApiMeta'}
        warnings: {type: array, items: {$ref: '#/components/schemas/ApiWarning'} }
    ComparisonRequest:
      type: object
      additionalProperties: false
      required: [usage_option_ids]
      properties:
        usage_option_ids: {type: array, minItems: 2, maxItems: 5, uniqueItems: true, items: {type: string, maxLength: 160}}
        origin: {$ref: '#/components/schemas/RecommendationOrigin'}
        date: {type: string, format: date}
        conditions: {$ref: '#/components/schemas/RecommendationConditions'}
    FactBasis:
      type: object
      required: [source_field, source_value, matched_terms]
      properties:
        source_field: {type: string}
        source_value: {type: [string, 'null']}
        matched_terms: {type: array, items: {type: string}}
    DerivedFact:
      type: object
      required: [state, value, values, reason_code, basis]
      properties:
        state: {type: string, enum: [KNOWN, UNKNOWN]}
        value: {}
        values: {type: [array, 'null'], items: {type: string}}
        reason_code: {type: [string, 'null']}
        basis:
          anyOf:
            - $ref: '#/components/schemas/FactBasis'
            - type: 'null'
    ProgramFacts:
      type: object
      required: [category, level, target_groups, start_time, period, straight_line_distance_meters]
      properties:
        category: {$ref: '#/components/schemas/DerivedFact'}
        level: {$ref: '#/components/schemas/DerivedFact'}
        target_groups: {$ref: '#/components/schemas/DerivedFact'}
        start_time: {$ref: '#/components/schemas/DerivedFact'}
        period: {$ref: '#/components/schemas/DerivedFact'}
        straight_line_distance_meters: {$ref: '#/components/schemas/DerivedFact'}
    RecommendationOption:
      allOf:
        - $ref: '#/components/schemas/UsageOption'
        - type: object
          required: [facility_name, facility_type_name, road_address, longitude, latitude]
          properties:
            facility_name: {type: string}
            facility_type_name: {type: [string, 'null']}
            road_address: {type: [string, 'null']}
            longitude: {type: number}
            latitude: {type: number}
    ScoreComponent:
      type: object
      required: [code, points]
      properties:
        code: {type: string}
        points: {type: integer}
    RecommendationItem:
      type: object
      required: [rank, score, score_components, matched_conditions, unmet_preferred_conditions, uncertainty_codes, facts, option]
      properties:
        rank: {type: integer, minimum: 1}
        score: {type: integer}
        score_components: {type: array, items: {$ref: '#/components/schemas/ScoreComponent'}}
        matched_conditions: {type: array, items: {type: string}}
        unmet_preferred_conditions: {type: array, items: {type: string}}
        uncertainty_codes: {type: array, items: {type: string}}
        facts: {$ref: '#/components/schemas/ProgramFacts'}
        option: {$ref: '#/components/schemas/RecommendationOption'}
    ExcludedOption:
      type: object
      required: [usage_option_id, facility_id, reason_codes]
      properties:
        usage_option_id: {type: string}
        facility_id: {type: string}
        reason_codes: {type: array, items: {type: string}}
    ExclusionCount:
      type: object
      required: [reason_code, count]
      properties:
        reason_code: {type: string}
        count: {type: integer}
    RecommendationData:
      type: object
      required: [date, origin_provided, program_dataset_version, program_as_of, attribution, counts, recommendations, excluded, excluded_truncated, exclusion_summary, unavailable_reason_codes]
      properties:
        date: {type: string, format: date}
        origin_provided: {type: boolean}
        program_dataset_version: {type: [string, 'null']}
        program_as_of: {type: [string, 'null'], format: date-time}
        attribution: {type: [string, 'null']}
        counts:
          type: object
          required: [candidates, eligible, excluded, returned]
          properties:
            candidates: {type: integer}
            eligible: {type: integer}
            excluded: {type: integer}
            returned: {type: integer}
        recommendations: {type: array, items: {$ref: '#/components/schemas/RecommendationItem'}}
        excluded: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/ExcludedOption'}}
        excluded_truncated: {type: boolean}
        exclusion_summary: {type: array, items: {$ref: '#/components/schemas/ExclusionCount'}}
        unavailable_reason_codes: {type: array, items: {type: string}}
    RecommendationEnvelope:
      type: object
      required: [data, meta, warnings]
      properties:
        data: {$ref: '#/components/schemas/RecommendationData'}
        meta: {$ref: '#/components/schemas/ApiMeta'}
        warnings: {type: array, items: {$ref: '#/components/schemas/ApiWarning'}}
    ComparisonItem:
      type: object
      required: [usage_option_id, eligible, exclusion_reason_codes, score, score_components, matched_conditions, unmet_preferred_conditions, uncertainty_codes, facts, option]
      properties:
        usage_option_id: {type: string}
        eligible: {type: boolean}
        exclusion_reason_codes: {type: array, items: {type: string}}
        score: {type: [integer, 'null']}
        score_components: {type: array, items: {$ref: '#/components/schemas/ScoreComponent'}}
        matched_conditions: {type: array, items: {type: string}}
        unmet_preferred_conditions: {type: array, items: {type: string}}
        uncertainty_codes: {type: array, items: {type: string}}
        facts: {$ref: '#/components/schemas/ProgramFacts'}
        option: {$ref: '#/components/schemas/RecommendationOption'}
    ComparisonDimension:
      type: object
      required: [dimension, values, best_usage_option_ids]
      properties:
        dimension: {type: string, enum: [PRICE_WON, STRAIGHT_LINE_DISTANCE_METERS, START_TIME, WEEKDAYS, PERIOD, PROGRAM_APPLICATION, TARGET_GROUPS, LEVEL]}
        values:
          type: array
          items:
            type: object
            required: [usage_option_id, state, value]
            properties:
              usage_option_id: {type: string}
              state: {type: string, enum: [KNOWN, UNKNOWN]}
              value: {}
        best_usage_option_ids: {type: array, items: {type: string}}
    ComparisonData:
      type: object
      required: [date, origin_provided, program_dataset_version, program_as_of, attribution, items, dimensions, unavailable_reason_codes]
      properties:
        date: {type: string, format: date}
        origin_provided: {type: boolean}
        program_dataset_version: {type: [string, 'null']}
        program_as_of: {type: [string, 'null'], format: date-time}
        attribution: {type: [string, 'null']}
        items: {type: array, items: {$ref: '#/components/schemas/ComparisonItem'}}
        dimensions: {type: array, items: {$ref: '#/components/schemas/ComparisonDimension'}}
        unavailable_reason_codes: {type: array, items: {type: string}}
    ComparisonEnvelope:
      type: object
      required: [data, meta, warnings]
      properties:
        data: {$ref: '#/components/schemas/ComparisonData'}
        meta: {$ref: '#/components/schemas/ApiMeta'}
        warnings: {type: array, items: {$ref: '#/components/schemas/ApiWarning'}}
    ExerciseContentItem:
      type: object
      required: [content_id, title, summary, category, sport_tags, audience, thumbnail_url, content_url, source_name, source_url, checked_at, usage_terms]
      properties:
        content_id: {type: string}
        title: {type: string}
        summary: {type: string}
        category: {type: string, enum: [POOL, GYM, FIELD, BALL, OTHER]}
        sport_tags:
          type: array
          items: {type: string, enum: [SWIMMING, RUNNING, STRETCHING, FITNESS, YOGA_PILATES, DANCE, TENNIS, BADMINTON, TABLE_TENNIS, GOLF, SQUASH, SKATING, TEAM_BALL, MARTIAL_ARTS, CLIMBING]}
        audience: {type: string}
        thumbnail_url: {type: string, format: uri}
        content_url: {type: string, format: uri}
        source_name: {type: string}
        source_url: {type: string, format: uri}
        checked_at: {type: [string, 'null'], format: date}
        usage_terms: {type: [string, 'null']}
    ExerciseContentsData:
      type: object
      required: [contents, sport]
      properties:
        contents: {type: array, items: {$ref: '#/components/schemas/ExerciseContentItem'}}
        sport: {type: [string, 'null']}
    ExerciseContentsMeta:
      type: object
      required: [request_id, dataset_version, as_of]
      properties:
        request_id: {type: string, format: uuid}
        dataset_version: {type: string, pattern: '^curated-exercise-contents-[0-9a-f]{12}$'}
        as_of: {type: 'null'}
    ExerciseContentsEnvelope:
      type: object
      required: [data, meta, warnings]
      properties:
        data: {$ref: '#/components/schemas/ExerciseContentsData'}
        meta: {$ref: '#/components/schemas/ExerciseContentsMeta'}
        warnings: {type: array, items: {$ref: '#/components/schemas/ApiWarning'}}
    OperatorTime:
      type: object
      required: [start_time, end_time, days, operator_program_name, valid_from, valid_to, sources, checked_at]
      properties:
        start_time:
          type: string
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
        end_time:
          type: string
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
        days:
          type: [string, 'null']
        operator_program_name:
          type: string
        valid_from:
          type: string
          format: date
        valid_to:
          type: string
          format: date
        sources:
          type: array
          items:
            type: object
            required: [name, url]
            properties:
              name:
                type: string
              url:
                type: string
                format: uri
        checked_at:
          type: string
          format: date-time
